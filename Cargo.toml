[package]
name = "kanjclubs"
version = "0.1.0"
edition = "2024"

[dependencies]
opaque-ke = { version = "4.0.1", features = ["argon2", "ristretto255", "std"] }
sha2 = "=0.10.9"
digest = "=0.10.7"
anyhow = "1.0.104"
heed = "0.23.1"
home = "0.5.12"
serde = "1.0.229"
bincode = { version = "=2.0.0-rc.3", features = ["serde"] }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
rand = { version = "0.10.3", features = ["std"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
axum-governor = "2.1.2"
rand_core = { version = "0.10.1", features = ["std"] }
